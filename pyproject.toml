[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tar-crispr-pipeline"
version = "1.0.0"
description = "Automated TAR cloning + CRISPR/Cas9 (CATCH-style) pipeline for BGC capture from Streptomyces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "PhD Researcher, University of São Paulo"}
]
keywords = ["CRISPR", "TAR", "CATCH", "BGC", "actinobacteria", "primer design", "synthetic biology"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "biopython>=1.80",
  "pydna>=5.0",
  "primer3-py>=0.7",
  "matplotlib>=3.7",
  "typer>=0.9",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
pipeline-tar-crispr = "tar_crispr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
